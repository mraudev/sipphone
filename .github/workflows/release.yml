# Baut bei einem Versions-Tag (z.B. v1.0.0) Setup + Portable-exe und veröffentlicht sie als GitHub-Release;
# danach werden die Linux-Pakete (AppImage + .deb) an dasselbe Release gehängt.
# Die installierten Apps finden das Release über electron-updater (latest.yml / latest-linux.yml).
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      # Actions auf feste Commits gepinnt: ein verschobener Tag kann keinen fremden Code in den Build bringen.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build
        run: npx electron-builder --win --publish never
      # Genau ein Release pro Tag selbst anlegen. electron-builder lädt die Dateien parallel hoch und hat
      # dabei zwei Releases zum selben Tag erzeugt (eins nur mit der Blockmap) – der Updater bekam dann
      # für latest.yml ein 404. Vorhandene Releases zum Tag (z.B. von einem früheren Lauf) werden ersetzt.
      - name: Release veröffentlichen
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="$GITHUB_REF_NAME"
          while gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; do
            gh release delete "$tag" --yes --repo "$GITHUB_REPOSITORY"
          done
          gh release create "$tag" \
            dist/SIP-Phone-Setup-*.exe dist/SIP-Phone-Setup-*.exe.blockmap dist/SIP-Phone-*-portable.exe dist/latest.yml \
            --title "$tag" --generate-notes --repo "$GITHUB_REPOSITORY"

  # Linux-Pakete bauen und an das Release des Windows-Jobs hängen (erst danach, damit es genau ein Release gibt).
  linux:
    needs: release
    runs-on: ubuntu-24.04 # fest statt ubuntu-latest: kein ungeplanter Wechsel auf Ubuntu 26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build
        run: npx electron-builder --linux --publish never
      - name: Linux-Dateien zum Release hinzufügen
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "$GITHUB_REF_NAME" \
            dist/SIP-Phone-*.AppImage dist/sip-phone_*.deb dist/latest-linux.yml \
            --clobber --repo "$GITHUB_REPOSITORY"
