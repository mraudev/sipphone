# Baut bei einem Versions-Tag (z.B. v0.2.0) Setup + Portable-exe und veröffentlicht sie als GitHub-Release.
# Die installierten Apps finden das Release über electron-updater (latest.yml) und aktualisieren sich.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build und Release veröffentlichen
        run: npx electron-builder --win --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # electron-builder hat die Blockmap bei v0.2.0 nicht hochgeladen; ohne sie lädt der Updater
      # jedes Mal das komplette Setup statt nur der geänderten Blöcke.
      - name: Blockmap hochladen
        shell: bash
        run: gh release upload "$GITHUB_REF_NAME" dist/*.blockmap --clobber --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
